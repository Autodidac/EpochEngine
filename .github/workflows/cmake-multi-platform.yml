name: CMake Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            generator: Visual Studio 17 2022
            generator_args: -A x64
            build_config: Release
            extra_args: ""
          - name: linux-gcc
            os: ubuntu-latest
            generator: Ninja
            generator_args: ""
            build_config: Release
            extra_args: -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
          - name: linux-clang
            os: ubuntu-latest
            generator: Ninja
            generator_args: ""
            build_config: Release
            extra_args: -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: >
          cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci"
          -G "${{ matrix.generator }}"
          ${{ matrix.generator_args }}
          ${{ matrix.extra_args }}

      - name: Build
        shell: bash
        run: >
          cmake --build "$GITHUB_WORKSPACE/build/ci"
          --config "${{ matrix.build_config }}"
          --target epoch
