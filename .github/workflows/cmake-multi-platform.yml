name: CMake Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-2022
            shell: pwsh
            configure_command: >
              python -m cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE/build/ci"
              -G "Visual Studio 17 2022"
              -A x64
              -DEPOCH_CI_HEADLESS_ONLY=ON
            build_command: >
              python -m cmake --build "$env:GITHUB_WORKSPACE/build/ci"
              --config Release
              --target epoch_ci_headless epoch_texture_artifact_contract
            test_command: >
              python -m cmake -E chdir "$env:GITHUB_WORKSPACE/build/ci"
              ctest -C Release --output-on-failure
          - name: windows-msvc-cpp26
            os: windows-2022
            shell: pwsh
            configure_command: >
              python -m cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE/build/ci"
              -G "Visual Studio 17 2022"
              -A x64
              -DEPOCH_CI_HEADLESS_ONLY=ON
              -DEPOCH_ENABLE_CPP26_LANE=ON
            build_command: >
              python -m cmake --build "$env:GITHUB_WORKSPACE/build/ci"
              --config Release
              --target epoch_ci_headless epoch_texture_artifact_contract
            test_command: |
              python -m cmake -E chdir "$env:GITHUB_WORKSPACE/build/ci" ctest -C Release --output-on-failure
          - name: linux-gcc
            os: ubuntu-latest
            shell: bash
            configure_command: >
              python -m cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci"
              -G Ninja
              -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16
              -DCMAKE_BUILD_TYPE=Release
              -DEPOCH_CI_HEADLESS_ONLY=ON
            install_gcc_current: true
            build_command: >
              python -m cmake --build "$GITHUB_WORKSPACE/build/ci"
              --target epoch_ci_headless
            test_command: >
              python -m cmake -E chdir "$GITHUB_WORKSPACE/build/ci"
              ctest --output-on-failure -R '^epoch_ci_headless$'
          - name: linux-clang
            os: ubuntu-latest
            shell: bash
            configure_command: >
              python -m cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci"
              -G Ninja
              -DCMAKE_C_COMPILER=clang-22 -DCMAKE_CXX_COMPILER=clang++-22
              -DCMAKE_CXX_COMPILER_CLANG_SCAN_DEPS=clang-scan-deps-22
              -DCMAKE_BUILD_TYPE=Release
              -DEPOCH_CI_HEADLESS_ONLY=ON
            install_llvm_current: true
            build_command: >
              python -m cmake --build "$GITHUB_WORKSPACE/build/ci"
              --target epoch_ci_headless epoch_texture_artifact_contract
            test_command: >
              python -m cmake -E chdir "$GITHUB_WORKSPACE/build/ci"
              ctest --output-on-failure
          - name: linux-clang-engine
            os: ubuntu-latest
            shell: bash
            install_linux_render_deps: true
            install_llvm_current: true
            prepare_vcpkg: true
            configure_command: >
              bash "$GITHUB_WORKSPACE/Engine/build.sh"
              --check-toolchain
              --vcpkg-root "$VCPKG_ROOT"
              clang Release
            build_command: >
              bash "$GITHUB_WORKSPACE/Engine/build.sh"
              --vcpkg-root "$VCPKG_ROOT"
              clang Release --
              -DEPOCH_REQUIRE_OPTIONAL_DEPENDENCIES=ON
            test_command: >
              python -m cmake -E chdir "$GITHUB_WORKSPACE/Engine/Bin/Clang-Release"
              ctest --output-on-failure

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install modern CMake
        run: python -m pip install cmake==4.4.0

      - name: Install current Ninja (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ninja-win.zip'
          $installRoot = Join-Path $env:RUNNER_TEMP 'ninja-1.13.2'
          Invoke-WebRequest `
            -Uri 'https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip' `
            -OutFile $archive
          $actualHash = (Get-FileHash -Algorithm SHA512 $archive).Hash.ToLowerInvariant()
          $expectedHash = '55d3d891e8fc6c8ad7f92e172125319896761e57c5125944613d9bbfa5b9374387e9fc1468ad5bcb31464f43fb1c455ea251343942595f42955dc67090aa12ee'
          if ($actualHash -ne $expectedHash) {
            throw "Ninja archive checksum mismatch: expected $expectedHash, got $actualHash"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $installRoot -Force
          Add-Content -Path $env:GITHUB_PATH -Value $installRoot

      - name: Install current Ninja (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          archive="$RUNNER_TEMP/ninja-linux.zip"
          install_root="$RUNNER_TEMP/ninja-1.13.2"
          curl --fail --location --retry 3 \
            https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip \
            --output "$archive"
          echo "714b900cf10b7ecb1b641c91f4ef696250c64984e5955a8088e4a538d6e8077f43e55f6da47efcedbe316c68d51a9e98feff51734eb0eac1b17aa85af5698753  $archive" | sha512sum --check --strict
          mkdir -p "$install_root"
          unzip -q -o "$archive" -d "$install_root"
          chmod 755 "$install_root/ninja"
          echo "$install_root" >> "$GITHUB_PATH"

      - name: Install current LLVM
        if: runner.os == 'Linux' && matrix.install_llvm_current == true
        shell: bash
        run: |
          curl --fail --location --retry 3 https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
          chmod 755 "$RUNNER_TEMP/llvm.sh"
          sudo "$RUNNER_TEMP/llvm.sh" 22
          sudo apt-get install -y clang-tools-22

      - name: Install current GCC
        if: runner.os == 'Linux' && matrix.install_gcc_current == true
        shell: bash
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Prepare current vcpkg registry
        if: runner.os == 'Linux' && matrix.prepare_vcpkg == true
        shell: bash
        run: |
          git clone --branch 2026.06.24 --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Export Python tool shims on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source -Parent
          $scriptsDir = Join-Path $pythonDir 'Scripts'
          Add-Content -Path $env:GITHUB_PATH -Value $pythonDir
          if (Test-Path $scriptsDir) {
            Add-Content -Path $env:GITHUB_PATH -Value $scriptsDir
          }

      - name: Export Python tool shims on PATH (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python_dir="$(dirname "$(command -v python)")"
          echo "$python_dir" >> "$GITHUB_PATH"

      - name: Report tool versions
        run: |
          python --version
          python -m pip --version
          cmake --version
          ninja --version

      - name: Install Linux rendering build dependencies
        if: runner.os == 'Linux' && matrix.install_linux_render_deps == true
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake libtool pkg-config \
            libasound2-dev libdbus-1-dev libibus-1.0-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libvulkan-dev \
            libsfml-dev \
            libudev-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxft-dev \
            libxinerama-dev \
            libxi-dev \
            libxrandr-dev \
            libxrender-dev \
            libxtst-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Install Linux release smoke display
        if: runner.os == 'Linux' && matrix.name == 'linux-clang-engine'
        shell: bash
        run: sudo apt-get install -y xvfb xauth

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.configure_command }}

      - name: Configure (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.configure_command }}

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.build_command }}

      - name: Build (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.build_command }}

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ matrix.test_command }}

      - name: Test (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: ${{ matrix.test_command }}

      - name: Stage Linux release package
        if: runner.os == 'Linux' && matrix.name == 'linux-clang-engine'
        shell: bash
        run: |
          set -euo pipefail
          version_module="$GITHUB_WORKSPACE/Engine/modules/epoch.version.ixx"
          version="$(pwsh -NoProfile -File "$GITHUB_WORKSPACE/Tools/ai/get_epoch_version.ps1" -VersionModule "$version_module")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]{2,}$ ]] || {
            echo "Invalid canonical Epoch version: $version" >&2
            exit 1
          }
          binary_root="$GITHUB_WORKSPACE/Engine/Bin/Clang-Release"
          artifact_root="$RUNNER_TEMP/epoch-release"
          stage_name="epoch_linux_x64_v$version"
          stage="$artifact_root/$stage_name"

          rm -rf "$artifact_root"
          mkdir -p "$stage"
          cp "$binary_root/epoch" "$stage/epoch"
          cp -a "$GITHUB_WORKSPACE/Engine/assets" "$stage/assets"
          cp "$GITHUB_WORKSPACE/README.md" "$stage/README.md"
          cp "$GITHUB_WORKSPACE/LICENSE" "$stage/LICENSE"
          if [[ -d "$binary_root/lib" ]]; then
            cp -a "$binary_root/lib" "$stage/lib"
          fi

          pwsh -NoProfile -File "$GITHUB_WORKSPACE/Tools/ai/collect_third_party_notices.ps1" \
            -RepoRoot "$GITHUB_WORKSPACE" \
            -VcpkgInstalledRoot "$binary_root/vcpkg_installed/x64-linux-epoch" \
            -Destination "$stage"

          chmod 755 "$stage/epoch"
          cd "$stage"
          test -f assets/fonts/Roboto-Regular.ttf
          test -f THIRD_PARTY_NOTICES.txt
          test -f THIRD_PARTY_COMPONENTS.json
          runpath="$(readelf -d ./epoch | sed -n 's/.*RUNPATH.*\[\(.*\)\].*/\1/p')"
          if [[ "$runpath" != '$ORIGIN/lib' ]]; then
            echo "Unexpected packaged RUNPATH: $runpath" >&2
            exit 1
          fi
          ldd_output="$(ldd ./epoch)"
          if grep -F 'not found' <<<"$ldd_output"; then
            echo 'Packaged Linux binary has unresolved shared libraries.' >&2
            exit 1
          fi
          if grep -F 'vcpkg_installed' <<<"$ldd_output"; then
            echo 'Packaged Linux binary resolved a dependency from vcpkg build output.' >&2
            exit 1
          fi
          if grep -F "$GITHUB_WORKSPACE/" <<<"$ldd_output"; then
            echo 'Packaged Linux binary resolved a dependency from GITHUB_WORKSPACE.' >&2
            exit 1
          fi
          for library in libsfml-graphics.so.3.0 libsfml-window.so.3.0 libsfml-system.so.3.0 libvulkan.so.1; do
            resolved="$(awk -v name="$library" '$1 == name && $2 == "=>" { print $3; exit }' <<<"$ldd_output")"
            expected="$stage/lib/$library"
            if [[ -z "$resolved" || "$(readlink -f "$resolved")" != "$(readlink -f "$expected")" ]]; then
              printf 'Packaged dependency %s resolved outside its staged lib directory: %s\n' "$library" "$resolved" >&2
              exit 1
            fi
          done
          version_output="$(xvfb-run -a ./epoch --version 2>&1)"
          if ! grep -F "Epoch v$version" <<<"$version_output"; then
            printf 'Packaged version check failed. Expected Epoch v%s. Output:\n%s\n' "$version" "$version_output" >&2
            exit 1
          fi
          contract_output="$(xvfb-run -a ./epoch --engine-contract-self-test 2>&1)"
          if ! grep -F 'engine_contract_self_test.result=pass' <<<"$contract_output"; then
            printf 'Packaged engine contract failed. Output:\n%s\n' "$contract_output" >&2
            exit 1
          fi
          timeout --signal=INT --kill-after=3s 30s \
            xvfb-run -a ./epoch --editor --renderer opengl --smoke

          rm -rf logs cache
          cd "$artifact_root"
          tar -czf "$stage_name.tar.gz" "$stage_name"
          ! tar -tzf "$stage_name.tar.gz" | grep -E '/(logs|cache)/'
          sha256sum "$stage_name.tar.gz" > "v$version"_checksums.txt

      - name: Upload Linux release package
        if: runner.os == 'Linux' && matrix.name == 'linux-clang-engine'
        uses: actions/upload-artifact@v4
        with:
          name: epoch-linux-release
          path: |
            ${{ runner.temp }}/epoch-release/epoch_linux_x64_v*.tar.gz
            ${{ runner.temp }}/epoch-release/v*_checksums.txt
          if-no-files-found: error
