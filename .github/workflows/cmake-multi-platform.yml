name: CMake Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
            shell: powershell
            configure_command: >
              cmake -S "$env:GITHUB_WORKSPACE" -B "$env:GITHUB_WORKSPACE/build/ci"
              -G "Visual Studio 17 2022"
              -A x64
            build_command: >
              cmake --build "$env:GITHUB_WORKSPACE/build/ci"
              --config Release
              --target epoch
          - name: linux-gcc
            os: ubuntu-latest
            shell: bash
            configure_command: >
              cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci"
              -G Ninja
              -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            build_command: >
              cmake --build "$GITHUB_WORKSPACE/build/ci"
              --config Release
              --target epoch
          - name: linux-clang
            os: ubuntu-latest
            shell: bash
            configure_command: >
              cmake -S "$GITHUB_WORKSPACE" -B "$GITHUB_WORKSPACE/build/ci"
              -G Ninja
              -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
            build_command: >
              cmake --build "$GITHUB_WORKSPACE/build/ci"
              --config Release
              --target epoch

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        shell: ${{ matrix.shell }}
        run: python -m pip install --upgrade pip

      - name: Install modern CMake and Ninja
        shell: ${{ matrix.shell }}
        run: python -m pip install cmake==3.30.5 ninja

      - name: Export Python tool shims on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonDir = Split-Path (Get-Command python).Source -Parent
          $scriptsDir = Join-Path $pythonDir 'Scripts'
          Add-Content -Path $env:GITHUB_PATH -Value $pythonDir
          if (Test-Path $scriptsDir) {
            Add-Content -Path $env:GITHUB_PATH -Value $scriptsDir
          }

      - name: Export Python tool shims on PATH (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python_dir="$(dirname "$(command -v python)")"
          echo "$python_dir" >> "$GITHUB_PATH"

      - name: Report tool versions
        shell: ${{ matrix.shell }}
        run: |
          python --version
          python -m pip --version
          cmake --version
          ninja --version

      - name: Configure
        shell: ${{ matrix.shell }}
        run: ${{ matrix.configure_command }}

      - name: Build
        shell: ${{ matrix.shell }}
        run: ${{ matrix.build_command }}
