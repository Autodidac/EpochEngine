name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epoch-public-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_MAX_CONCURRENCY: 2
  VCPKG_DISABLE_METRICS: 1

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_FORCE_SYSTEM_BINARIES: '1'
      MSBUILDDISABLENODEREUSE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public edition and source content
        run: python Tools/build/verify_public_source.py
      - name: Check graphics test failure handling
        run: python -m unittest discover -s Tests/build -p test_linux_graphics_smoke.py -v
      - name: Install build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $toolRoot = Join-Path $PWD 'Artifacts/Tooling/public-ci/tools'
          New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
          $requirements = Join-Path $toolRoot 'windows-build-tools.txt'
          @'
          cmake==4.4.0 --hash=sha256:13209a4d89d554c0b5623ed1158024b045e468bbb912c3f491de5e957b940858
          ninja==1.13.2 --hash=sha256:1293f4078278b70d0ee4b6cc8f3a9e030656c9b2f59909970343c4fe76070118
          '@ | Set-Content -LiteralPath $requirements -Encoding ascii
          python -m pip install --require-hashes --only-binary=:all: -r $requirements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cmakeVersion = & (Join-Path $scripts 'cmake.exe') --version
          if ($LASTEXITCODE -ne 0 -or $cmakeVersion[0] -cne 'cmake version 4.4.0') { throw 'Unexpected CMake version' }
          $ninjaVersion = & (Join-Path $scripts 'ninja.exe') --version
          if ($LASTEXITCODE -ne 0 -or $ninjaVersion -cne '1.13.2') { throw 'Unexpected Ninja version' }
          $scripts | Add-Content -LiteralPath $env:GITHUB_PATH
      - name: Prepare manifest-pinned dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = (Get-Content Engine/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          if ($baseline -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid dependency baseline' }
          $root = Join-Path $PWD 'Artifacts/Tooling/public-ci/vcpkg'
          git init $root
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root remote add origin https://github.com/microsoft/vcpkg.git
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root fetch --depth 1 origin $baseline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $root checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$root/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "EPOCH_VCPKG_ROOT=$root" | Add-Content -Path $env:GITHUB_ENV
      - name: Build actual Debug engine and component tests
        shell: pwsh
        run: |
          cmake --preset windows-msvc-debug "-DVCPKG_INSTALLED_DIR=$PWD/Artifacts/Dependencies/vcpkg_installed" -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build --preset windows-msvc-debug --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run compiled component and engine contracts
        shell: pwsh
        run: |
          $env:PATH = "$PWD/Artifacts/Dependencies/vcpkg_installed/x64-windows/debug/bin;$PWD/Artifacts/Dependencies/vcpkg_installed/x64-windows/bin;$env:PATH"
          $env:EPOCH_TEST_INCLUDE_ROOT = "$PWD/Artifacts/Dependencies/vcpkg_installed/x64-windows/include"
          $env:TEMP = "$PWD/Artifacts/Tooling/public-ci/test-scratch"
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          $env:TMP = $env:TEMP
          ctest --preset windows-msvc-debug --output-on-failure --no-tests=error --timeout 180
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build production Release Editor
        shell: pwsh
        run: cmake --build --preset windows-msvc-both-release --parallel 2
      - name: Stage and audit Windows Release runtime
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (& ./Tools/build/get_epoch_version.ps1).Trim()
          if ($version -cnotmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          ./Tools/build/stage_epoch_windows_release.ps1 -Version $version `
            -ReleaseOutputRoot "$PWD/Artifacts/Runtime/cmake/windows-msvc-debug/Release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tools/build/verify_public_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Return audited Windows runtime only
        uses: actions/upload-artifact@v4
        with:
          name: epoch-public-windows-runtime
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          path: |
            Artifacts/Packages/public/v${{ steps.package.outputs.version }}/epoch_win10_x64_v${{ steps.package.outputs.version }}.zip
            Artifacts/Packages/public/v${{ steps.package.outputs.version }}/epoch_win10_x64_v${{ steps.package.outputs.version }}.zip.sha256
            Artifacts/Packages/public/v${{ steps.package.outputs.version }}/epoch_win10_x64_v${{ steps.package.outputs.version }}.zip.build-validation.json

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      DISPLAY: ''
      WAYLAND_DISPLAY: ''
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public edition and source content
        run: python Tools/build/verify_public_source.py
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git unzip xz-utils pkg-config autoconf autoconf-archive automake libtool \
            libasound2-dev libdbus-1-dev libibus-1.0-dev libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev \
            libudev-dev libx11-dev libxcursor-dev libxext-dev libxft-dev libxinerama-dev libxi-dev libxrandr-dev \
            libxrender-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols xvfb xauth libgl1-mesa-dri mesa-utils mesa-vulkan-drivers
      - name: Prepare pinned vcpkg and Linux tool archives
        run: |
          set -euo pipefail
          fetch_tool_asset() {
            local repo="$1" tag="$2" asset="$3" output="$4" digest="$5" checksum="$6"
            local api="https://api.github.com/repos/$repo/releases"
            local id
            id="$(curl -fsSL --retry 3 "$api/tags/$tag" | python -c '
          import json, sys
          assets = [asset["id"] for asset in json.load(sys.stdin)["assets"] if asset["name"] == sys.argv[1]]
          if len(assets) != 1:
              raise SystemExit("Expected one exact release asset")
          print(assets[0])
          ' "$asset")"
            [[ "$id" =~ ^[0-9]+$ ]]
            curl -fsSL --retry 3 --connect-timeout 10 --max-time 120 \
              -H 'Accept: application/octet-stream' "$api/assets/$id?download=1" -o "$output.part"
            printf '%s  %s\n' "$digest" "$output.part" | "$checksum" -c --status
            mv "$output.part" "$output"
          }
          baseline="$(python -c 'import json; print(json.load(open("Engine/vcpkg.json"))["builtin-baseline"])')"
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          root="$GITHUB_WORKSPACE/Artifacts/Tooling/public-ci/vcpkg"
          git init "$root"
          git -C "$root" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$root" fetch --depth 1 origin "$baseline"
          git -C "$root" checkout --detach FETCH_HEAD
          source "$root/scripts/vcpkg-tool-metadata.txt"
          fetch_tool_asset microsoft/vcpkg-tool "$VCPKG_TOOL_RELEASE_TAG" vcpkg-glibc \
            "$root/vcpkg" "$VCPKG_GLIBC_SHA" sha512sum
          chmod +x "$root/vcpkg"
          "$root/vcpkg" version --disable-metrics
          echo "EPOCH_VCPKG_ROOT=$root" >> "$GITHUB_ENV"
          source <(sed 's/\r$//' Engine/unix/current_toolchain.env)
          downloads="$GITHUB_WORKSPACE/Artifacts/Tooling/public-ci/tools/downloads"
          mkdir -p "$downloads"
          cmake_archive="cmake-$EPOCH_CMAKE_VERSION-linux-x86_64.tar.gz"
          fetch_tool_asset Kitware/CMake "v$EPOCH_CMAKE_VERSION" "$cmake_archive" \
            "$downloads/$cmake_archive" "$EPOCH_CMAKE_LINUX_X64_SHA256" sha256sum
          fetch_tool_asset ninja-build/ninja "v$EPOCH_NINJA_VERSION" ninja-linux.zip \
            "$downloads/ninja-$EPOCH_NINJA_VERSION-linux.zip" "$EPOCH_NINJA_LINUX_X64_SHA256" sha256sum
      - name: Build with production pinned Clang bootstrap
        run: |
          set -euo pipefail
          bash Engine/build.sh --bootstrap-current-toolchain --tool-cache-root "$GITHUB_WORKSPACE/Artifacts/Tooling/public-ci/tools" \
            --vcpkg-root "$EPOCH_VCPKG_ROOT" clang Release -- -DBUILD_TESTING=ON -DEPOCH_ENABLE_GRAPHICS_TESTS=ON -DEPOCH_REQUIRE_OPTIONAL_DEPENDENCIES=ON
      - name: Run compiled component and engine contracts
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/Artifacts/Intermediate/cmake/linux/public/Clang-Release"
          cache="$build_dir/CMakeCache.txt"
          cmake_bin="$(sed -n 's/^CMAKE_COMMAND:INTERNAL=//p' "$cache")"
          ninja_bin="$(sed -n 's/^CMAKE_MAKE_PROGRAM:[^=]*=//p' "$cache")"
          cc="$(sed -n 's/^CMAKE_C_COMPILER:[^=]*=//p' "$cache")"
          cxx="$(sed -n 's/^CMAKE_CXX_COMPILER:[^=]*=//p' "$cache")"
          test -x "$cmake_bin"
          test -x "$ninja_bin"
          test -x "$cc"
          test -x "$cxx"
          test "$(dirname "$cc")" = "$(dirname "$cxx")"
          export CC="$cc" CXX="$cxx"
          cmake_dir="$(dirname "$cmake_bin")"
          ninja_dir="$(dirname "$ninja_bin")"
          compiler_dir="$(dirname "$cxx")"
          export PATH="$cmake_dir:$ninja_dir:$compiler_dir:$PATH"
          test "$(command -v cmake)" = "$cmake_bin"
          test "$(command -v ninja)" = "$ninja_bin"
          cmake --version
          ninja --version
          "$CXX" --version
          printf '%s\n' "$compiler_dir" "$ninja_dir" "$cmake_dir" >> "$GITHUB_PATH"
          printf 'CC=%s\nCXX=%s\n' "$CC" "$CXX" >> "$GITHUB_ENV"
          export TMPDIR="$GITHUB_WORKSPACE/Artifacts/Tooling/public-ci/test-scratch"
          mkdir -p "$TMPDIR"
          "$(dirname "$cmake_bin")/ctest" --test-dir "$build_dir" --output-on-failure \
            -LE graphics --no-tests=error --timeout 180
      - name: Render Linux Editor across compiled backends (Mesa CPU)
        run: |
          set -euo pipefail
          build_dir="$GITHUB_WORKSPACE/Artifacts/Intermediate/cmake/linux/public/Clang-Release"
          cmake_bin="$(sed -n 's/^CMAKE_COMMAND:INTERNAL=//p' "$build_dir/CMakeCache.txt")"
          "$(dirname "$cmake_bin")/ctest" --test-dir "$build_dir" --output-on-failure \
            -L graphics --no-tests=error
      - name: Stage and audit software OpenGL Linux runtime
        id: package
        run: |
          set -euo pipefail
          version="$(pwsh -NoProfile -File Tools/build/get_epoch_version.ps1)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a pwsh -NoProfile -File Tools/build/stage_epoch_linux_release.ps1 -Configuration Clang-Release
          python Tools/build/verify_public_source.py
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Return audited Linux runtime only
        uses: actions/upload-artifact@v4
        with:
          name: epoch-public-linux-runtime
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          path: |
            Artifacts/Packages/public/v${{ steps.package.outputs.version }}/epoch_linux_x64_v${{ steps.package.outputs.version }}.tar.gz
            Artifacts/Packages/public/v${{ steps.package.outputs.version }}/epoch_linux_x64_v${{ steps.package.outputs.version }}.tar.gz.sha256
            Artifacts/Packages/public/v${{ steps.package.outputs.version }}/epoch_linux_x64_v${{ steps.package.outputs.version }}.tar.gz.build-validation.json
