name: Validate public Site source on Linux
on:
  workflow_dispatch:
    inputs:
      source_sha256:
        description: SHA-256 of the frozen public Site 0.90.47 tar archive
        required: true
        type: string
permissions:
  contents: read
jobs:
  site-linux-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Fetch the frozen public Site source for this build only
        env:
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          curl --fail --location --retry 2 https://epoch.adamrushford.chatgpt.site/downloads/releases/v0.90.47/EpochEngine-0.90.47-source.tar.gz -o "$RUNNER_TEMP/site-source.tar.gz"
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/site-source.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/site-source"
          tar -xf "$RUNNER_TEMP/site-source.tar.gz" -C "$RUNNER_TEMP/site-source" --strip-components=1
      - name: Install compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++-12 git curl wget unzip zip tar xz-utils ca-certificates python3 python3-pip pkg-config autoconf autoconf-archive automake libtool bison flex ninja-build libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev libglu1-mesa-dev libasound2-dev libudev-dev libvulkan-dev
      - name: Build with the updater's pinned toolchain
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/site-source/Engine"
          export CMAKE_BUILD_PARALLEL_LEVEL=2
          bash build.sh --bootstrap-current-toolchain --tool-cache-root "$RUNNER_TEMP/update-tools" clang Release -- -DEPOCH_REQUIRE_OPTIONAL_DEPENDENCIES=ON > "$RUNNER_TEMP/site-build.log" 2>&1 || { tail -n 70 "$RUNNER_TEMP/site-build.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/site-build.log"
      - name: Verify version and pure engine contracts
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/site-source/Engine/Bin/Clang-Release"
          ./epoch --version | tee "$RUNNER_TEMP/site-version.log"
          grep -F 'Epoch v0.90.47' "$RUNNER_TEMP/site-version.log"
          mkdir -p "$RUNNER_TEMP/site-contract"
          ./epoch --engine-contract-self-test --candidate-data-root "$RUNNER_TEMP/site-contract" > "$RUNNER_TEMP/site-contract.log" 2>&1 || { cat "$RUNNER_TEMP/site-contract.log"; exit 1; }
          grep -F 'engine_contract_self_test.result=pass' "$RUNNER_TEMP/site-contract.log"
      - name: Record build-only validation
        env:
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'site-linux-validation.json').write_text(json.dumps({
            'version': '0.90.47', 'source_sha256': os.environ['SOURCE_SHA256'],
            'run_id': os.environ['GITHUB_RUN_ID'], 'build': 'pass', 'pure_contracts': 'pass',
            'native_model_inference': 'not run', 'renderer_smoke': 'not run',
            'source_scope': 'Public Site archive fetched temporarily for compilation only'
          }, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: site-linux-build-validation
          path: ${{ runner.temp }}/site-linux-validation.json
          if-no-files-found: error
          retention-days: 7
      - name: Preserve build and contract diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-linux-build-diagnostics
          path: |
            ${{ runner.temp }}/site-build.log
            ${{ runner.temp }}/site-version.log
            ${{ runner.temp }}/site-contract.log
          if-no-files-found: warn
          retention-days: 7
